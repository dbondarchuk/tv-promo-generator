# Production: pull the published image from GHCR.
# For a local image build, use: docker compose -f docker-compose.build.yml up -d --build
services:
  promo-generator:
    image: ghcr.io/dbondarchuk/tv-promo-generator:latest
    ports:
      - "5174:5174"
    environment:
      PORT: "5174"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CACHE_PATH: /data/cache
      CONFIG_PATH: /data/config
      # Fallback when Settings → timezone is empty
      TIME_ZONE: ${TIME_ZONE:-America/New_York}
      # Optional for Intel VAAPI:
      # LIBVA_DRIVER_NAME: iHD
    volumes:
      # Host media library → container /library (Settings → Library path = /library)
      - ${MEDIA_PATH:-./media}:/library:ro
      # Promo preview MP4 + Remote Stream YAML; mount the same host folder into ErsatzTV
      - ${PROMO_PATH:-./output}:/data/output
      # Same files as ErsatzTV sees them (Settings → Remote Streams path / library path = /promos)
      - ${PROMO_PATH:-./output}:/promos
      - ${CONFIG_PATH:-./config}:/data/config
      - ${CACHE_PATH:-./cache}:/data/cache
      # ErsatzTV config (Settings → ersatztv.sqlite3 path = /etv-config/ersatztv.sqlite3)
      - ${ETV_CONFIG_PATH:-./etv-config}:/etv-config
    # Vaapi / Qsv (Intel/AMD) — uncomment when using hardware encode:
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - video
    #   - render
    # NVIDIA NVENC:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    restart: unless-stopped
